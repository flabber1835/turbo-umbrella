services:
  ollama:
    image: ollama/ollama:latest
    container_name: c64-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    # expose port to host so you can also run c64llama.py outside docker
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # One-shot service: pulls the model then exits
  ollama-pull:
    image: ollama/ollama:latest
    container_name: c64-pull
    entrypoint: ["ollama", "pull", "${MODEL:-tinyllama}"]
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    restart: "no"

  c64llama:
    image: ghcr.io/flabber1835/turbo-umbrella:latest
    container_name: c64llama
    stdin_open: true   # docker run -i
    tty: true          # docker run -t  (required for curses)
    environment:
      - OLLAMA_URL=http://ollama:11434/api/generate
      - MODEL=${MODEL:-tinyllama}
      - TERM=xterm-256color
    command: ["--model", "${MODEL:-tinyllama}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  ollama_data:
